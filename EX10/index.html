<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Registration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            min-height: 100vh; 
            display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 600; }
        input {
            width: 100%; padding: 12px;
            border: 2px solid #ddd; border-radius: 8px;
            transition: border-color 0.3s;
            font-size: 15px;
        }
        input:focus { border-color: #2a5298; outline: none; }
        .btn {
            width: 100%; padding: 14px;
            background: #2a5298; color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover { background: #1e3c72; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <form method="POST" action="validate.php">
            <div class="form-group">
                <label>Email Address</label>
                <input type="text" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Min. 8 characters" required>
            </div>
            <div class="form-group">
                <label>Credit Card Number</label>
                <input type="text" name="ccnumber" placeholder="16-digit card number" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" name="phone" placeholder="10-digit mobile number" required>
            </div>
            <button type="submit" class="btn">Register Securely</button>
        </form>
    </div>
</body>
</html>
