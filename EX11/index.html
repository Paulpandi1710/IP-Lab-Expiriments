<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order</title>
    <style>
        :root { --primary: #4CAF50; --primary-dark: #45a049; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #f4f7f6; 
            display: flex; justify-content: center; padding: 40px 20px;
        }
        .card {
            background: #fff; padding: 40px;
            border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%; max-width: 500px;
        }
        h2 { color: #333; margin-bottom: 30px; text-align: center; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        input {
            width: 100%; padding: 12px 16px;
            border: 1px solid #ddd; border-radius: 8px;
            font-size: 16px; transition: all 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(76,175,80,0.2); }
        .btn {
            width: 100%; padding: 14px;
            background: var(--primary); color: white;
            border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold;
            cursor: pointer; transition: background 0.3s;
            margin-top: 10px;
        }
        .btn:hover { background: var(--primary-dark); }
        .view-link { display: block; text-align: center; margin-top: 20px; color: var(--primary); text-decoration: none; }
        .view-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛒 New Order</h2>
        <form action="insert_order.php" method="POST">
            <div class="form-group">
                <label>Customer Name</label>
                <input type="text" name="customer_name" required>
            </div>
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" name="product_name" required>
            </div>
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" name="quantity" min="1" required>
            </div>
            <div class="form-group">
                <label>Price per item ($)</label>
                <input type="number" name="price" step="0.01" min="0" required>
            </div>
            <button type="submit" class="btn">Place Order</button>
        </form>
        <a href="view_orders.php" class="view-link">View All Orders</a>
    </div>
</body>
</html>
